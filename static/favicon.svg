<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background tile, rounded like the app surfaces -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#0e1114"/>

  <!-- CRT monitor body -->
  <rect x="4" y="5" width="24" height="18" rx="3"
        fill="#161b20" stroke="#39ff14" stroke-width="1.5"/>

  <!-- Screen -->
  <rect x="6.5" y="7.5" width="19" height="13" rx="1.5" fill="#07090b"/>

  <!-- Neon phosphor scanlines / text -->
  <g fill="#39ff14">
    <rect x="8.5" y="9.5"  width="10" height="1.4" rx="0.7" opacity="0.95"/>
    <rect x="8.5" y="12"   width="14" height="1.4" rx="0.7" opacity="0.8"/>
    <rect x="8.5" y="14.5" width="11" height="1.4" rx="0.7" opacity="0.65"/>
    <!-- Blinking cursor -->
    <rect x="8.5" y="17"   width="3"  height="1.6" rx="0.5" opacity="0.95"/>
  </g>

  <!-- Screen glow -->
  <rect x="6.5" y="7.5" width="19" height="13" rx="1.5"
        fill="none" stroke="#39ff14" stroke-width="0.6" opacity="0.3"/>

  <!-- Stand neck -->
  <rect x="14" y="23" width="4" height="2.5" fill="#161b20" stroke="#39ff14" stroke-width="1"/>

  <!-- Base -->
  <rect x="9" y="25.5" width="14" height="2.5" rx="1.2"
        fill="#161b20" stroke="#39ff14" stroke-width="1"/>
</svg>
